<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Heroic Archive</title>
    <meta name="description" content="A fantasy RPG character sheet and session journal app with a digital tome aesthetic." />
    <meta property="og:title" content="The Heroic Archive" />
    <meta property="og:description" content="A fantasy RPG character sheet and session journal app with a digital tome aesthetic." />
    <script>
      (function() {
        try {
          var isMobile = (window.innerWidth < 768) || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          var theme = isMobile ? 'light' : (localStorage.getItem('theme') || 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
